services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myjobflow-frontend-run
    working_dir: /app/my-job-flow
    volumes:
      - .:/app
      - /app/my-job-flow/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myjobflow-api-run
    working_dir: /app/api
    volumes:
      - .:/app
      - /app/api/node_modules
    ports:
      - "3333:3333"
    command: sh -c "npm install && npx prisma migrate dev --name init && npx prisma db seed && npm run dev"
